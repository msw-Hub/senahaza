name: CI/CD

# AWS Elastic Beanstalk 배포용 워크플로다. AWS 계정이 정지되어 서비스를 내린 뒤로는 쓰지 않는다.
# 커밋 메시지에 [BE]가 들어가도 자동으로 돌지 않도록 push 트리거를 막고, 수동 실행(workflow_dispatch)만 남겼다(2026-11).
# 이전 트리거:
# on:
#   push:
#     branches: [ main ]
on:
  workflow_dispatch:

jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, '[BE]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: sena-back

      - name: Build with Gradle
        run: ./gradlew clean build
        working-directory: sena-back

      - name: Get current time
        uses: josStorer/get-current-time@v2.0.2
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffset: "+09:00"

      - name: Set artifact name
        run: echo "artifact=sena-back-1.0.0.jar" >> $GITHUB_ENV
        working-directory: sena-back

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.APPLICATION_NAME }}
          environment_name: ${{ secrets.ENVIRONMENT_NAME }}
          version_label: github-action-${{ steps.current-time.outputs.formattedTime }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: ./sena-back/build/libs/${{ env.artifact }}